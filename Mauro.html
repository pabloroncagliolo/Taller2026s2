<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sistema de Control de Llamadas y Eventos de Pacientes Lista Espera</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			color: #ffffff;
			background: #1e3a5f;
		}

		.splash {
			width: min(90%, 720px);
			padding: 3rem 2rem;
			text-align: center;
			border-radius: 16px;
			background: linear-gradient(135deg, #2563eb, #0f766e);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
		}

		.splash img {
			width: 180px;
			height: 180px;
			object-fit: cover;
			border-radius: 50%;
			margin-bottom: 1.5rem;
		}

		h1 {
			margin: 0;
			font-size: clamp(1.6rem, 4vw, 2.5rem);
		}
	</style>
</head>
<body>
	<main class="splash">
		<img src="https://placehold.co/360x360/ffffff/2563eb?text=Pacientes" alt="Imagen genérica de pacientes">
		<h1>Sistema de Control de Llamadas y Eventos de Pacientes Lista Espera</h1>
	</main>
</body>
</html>
